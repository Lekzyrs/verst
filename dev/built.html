<!doctype html>
<!-- Локальный стенд первого экрана. Разметка повторяет опубликованный Zero Block Tilda:
     body > #allrecords > #recN > .t396 > .t396__artboard > .t396__elem.tn-elem > .tn-atom (docs/tilda-contract.md, «Разметка элемента»). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд: выпуск № 07</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@1..1000&display=swap">
<link rel="stylesheet" href="./dev.css">
</head>
<body class="t-body">
<div id="allrecords" class="t-records">
  <div id="rec1" class="r t-rec" data-record-type="396">
    <div class="t396">
      <div class="t396__artboard rendered" data-artboard-recid="1">
        <div class="t396__carrier" data-artboard-recid="1"></div>
        <div class="t396__filter" data-artboard-recid="1"></div>
        <div class="t396__elem tn-elem vs-poster tn-elem__1101" data-elem-id="101" data-elem-type="text">
          <div class="tn-atom" field="tn_text_101">ЛУМА</div>
        </div>
        <div class="t396__elem tn-elem vs-stage tn-elem__1102" data-elem-id="102" data-elem-type="shape">
          <div class="tn-atom"></div>
        </div>
        <div class="t396__elem tn-elem vs-label tn-elem__1103" data-elem-id="103" data-elem-type="text">
          <a class="tn-atom" href="/" data-click="brand">Верст</a>
        </div>
        <div class="t396__elem tn-elem vs-label tn-elem__1104" data-elem-id="104" data-elem-type="text">
          <div class="tn-atom" field="tn_text_104">Выпуск № 07</div>
        </div>
        <div class="t396__elem tn-elem vs-label vs-state tn-elem__1105" data-elem-id="105" data-elem-type="text">
          <div class="tn-atom" field="tn_text_105">выключена</div>
        </div>
        <div class="t396__elem tn-elem vs-label vs-pull tn-elem__1106" data-elem-id="106" data-elem-type="button">
          <a class="tn-atom" href="#ring" data-click="pull">
            <div class="tn-atom__button-content"><span class="tn-atom__button-text">потяни за кольцо</span></div>
            <span class="tn-atom__button-border"></span>
          </a>
        </div>
        <div class="t396__elem tn-elem vs-label tn-elem__1107" data-elem-id="107" data-elem-type="text">
          <div class="tn-atom" field="tn_text_107">112 / 300</div>
        </div>
        <div class="t396__elem tn-elem vs-label tn-elem__1108" data-elem-id="108" data-elem-type="text">
          <div class="tn-atom" field="tn_text_108">осталось</div>
        </div>
      </div>
    </div>
  </div>
  <div id="rec2" class="r t-rec" data-record-type="396">
    <div class="t396">
      <div class="t396__artboard rendered" data-artboard-recid="2">
        <div class="t396__carrier" data-artboard-recid="2"></div>
        <div class="t396__filter" data-artboard-recid="2"></div>
        <div class="t396__elem tn-elem tn-elem__2201" data-elem-id="201" data-elem-type="text">
          <div class="tn-atom" field="tn_text_201">Верст, выдуманная мастерская. Сайт-концепт: заказы не принимаются.</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // Крючки стенда для тестов. Работают до запуска boot: модульный скрипт ниже исполняется после этого.
  // ?nostage=1 убирает метку сцены, ?nolang=1 убирает lang у html (как на опубликованной Tilda),
  // ?zoom=1.2 ставит CSS zoom каждой обёртке .t396__elem (так Tilda масштабирует блок под окно),
  // ?nohref=1 убирает адрес у кнопки «потяни за кольцо»: такой узел сам фокус не получает.
  // window.__clicks считает настоящие клики по каждой ссылке и кнопке (ключ: data-click) и не даёт уйти со стенда.
  (() => {
    const q = new URLSearchParams(location.search);
    if (q.get('nostage') === '1') document.querySelectorAll('.vs-stage').forEach((el) => el.remove());
    if (q.get('nolang') === '1') document.documentElement.removeAttribute('lang');
    if (q.get('nohref') === '1') document.querySelectorAll('.vs-pull a').forEach((el) => el.removeAttribute('href'));
    const zoom = q.get('zoom');
    if (zoom) document.querySelectorAll('.t396__elem').forEach((el) => el.style.setProperty('zoom', zoom));
    const clicks = (window.__clicks = {});
    document.querySelectorAll('a, button').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        if (!e.isTrusted) return;
        const id = el.dataset.click;
        clicks[id] = (clicks[id] || 0) + 1;
      });
    });
  })();
</script>
<script src="/dist/verst.js" defer></script>
</body>
</html>
